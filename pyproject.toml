[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "overleaf-cookie-bridge"
version = "0.1.0"
description = "Cookie-only local bridge for safely pulling and backing up Overleaf projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "overleaf-cookie-bridge contributors" },
]
keywords = ["overleaf", "latex", "cli", "cookie", "backup", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "requests>=2.31",
]

[project.optional-dependencies]
browser = ["browser-cookie3>=0.19"]
test = ["pytest>=8.0", "responses>=0.25"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "responses>=0.25",
  "ruff>=0.8",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Master-chenk/overleaf-cookie-bridge"
Repository = "https://github.com/Master-chenk/overleaf-cookie-bridge"
Issues = "https://github.com/Master-chenk/overleaf-cookie-bridge/issues"

[project.scripts]
overleaf-cookie = "overleaf_cookie_bridge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
